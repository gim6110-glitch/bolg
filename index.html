<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교생활기록부 작성·검토 도우미</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1F3864;--blue:#2E5496;--bl:#D9E1F2;
  --red:#C00000;--rl:#FCE4E4;--or:#E07000;
  --yl:#FFF2CC;--gr:#F4F6FA;--bd:#D0D7E3;
  --tx:#1A1A2E;--su:#5A6070;--g2:#2E7D32;--gl:#E8F5E9;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gr);color:var(--tx);font-size:13px;line-height:1.6}
/* 헤더 */
header{background:var(--navy);color:#fff;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:15px;font-weight:700}
header p{font-size:10px;opacity:.65;margin-top:1px}
.hb{display:flex;gap:7px}.hbtn{font-size:11px;padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer}.hbtn:hover{background:rgba(255,255,255,.22)}.hbtn.on{background:#1a6b3c;border-color:#2d9e5f}
/* 모드 선택 - 가장 중요 */
.mode-select{background:#fff;border-bottom:3px solid var(--bl);padding:0 22px;display:flex;gap:0}
.mode-tab{padding:13px 28px;border:none;background:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--su);border-bottom:4px solid transparent;margin-bottom:-3px}
.mode-tab.on.write{color:var(--blue);border-bottom-color:var(--blue)}
.mode-tab.on.review{color:var(--red);border-bottom-color:var(--red)}
/* 영역 탭 */
.area-tabs{background:#F8F9FC;border-bottom:2px solid var(--bl);display:flex;padding:0 22px;gap:0;overflow-x:auto}
.atab{padding:9px 16px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--su);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.atab.on{color:var(--navy);border-bottom-color:var(--blue);font-weight:700}
/* 테이블 */
.tbl-wrap{overflow-x:auto;padding:16px 22px 90px}
table{border-collapse:collapse;min-width:100%;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(31,56,100,.09);overflow:hidden}
th{background:var(--navy);color:#fff;padding:9px 10px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap}
th.sh{background:var(--blue)}
th.rh{background:#7B1FA2}
td{padding:6px 8px;border:1px solid var(--bd);vertical-align:top;font-size:12px}
td.num{text-align:center;background:#F8F9FC;font-weight:700;color:var(--navy);width:36px}
tr:hover td:not(.num){background:#FAFBFF}
td textarea,td input,td select{width:100%;border:none;background:transparent;font-family:inherit;font-size:12px;color:var(--tx);resize:none;outline:none;line-height:1.55}
td textarea{min-height:58px}
td textarea:focus,td input:focus{background:#FFFDE7}
/* 결과 셀 - 작성 */
td.wres{background:var(--gl);min-width:200px}
td.wres textarea{color:var(--g2);min-height:75px}
/* 결과 셀 - 검토 */
td.rres{background:#F3E5F5;min-width:240px}
.viol-sum{font-size:11px;line-height:1.7}
.vh{color:var(--red);font-weight:700}.vm{color:var(--or);font-weight:700}.vl{color:var(--su)}
.fix-box{margin-top:6px;background:#E8F5E9;border-radius:5px;padding:6px 8px;font-size:11px;color:var(--g2);line-height:1.65;white-space:pre-wrap;word-break:break-all}
.sim-warn{margin-top:4px;background:var(--yl);border-radius:5px;padding:5px 8px;font-size:11px;color:#7A5500}
/* 버튼 */
.act{text-align:center;min-width:68px}
.rb{display:block;width:100%;margin-bottom:3px;padding:3px 0;border-radius:4px;border:1px solid;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700}
.rb.gen{background:var(--blue);color:#fff;border-color:var(--blue)}.rb.gen:hover{background:var(--navy)}.rb.gen:disabled{background:#9AAAC5;border-color:#9AAAC5;cursor:not-allowed}
.rb.rev{background:var(--red);color:#fff;border-color:var(--red)}.rb.rev:hover{background:#900}.rb.rev:disabled{background:#d49;border-color:#d49;cursor:not-allowed}
.rb.add{background:#fff;color:var(--g2);border-color:var(--g2)}
.rb.del{background:#fff;color:var(--red);border-color:var(--red)}
/* 글자수 */
.cnt{font-size:10px;text-align:right;margin-top:2px}
.cnt.ok{color:var(--blue)}.cnt.wn{color:var(--or);font-weight:700}.cnt.ov{color:var(--red);font-weight:700}
/* 로딩 */
.ldg{color:var(--blue);font-size:11px;padding:6px 0}
.err-cell{color:var(--red);font-size:11px;padding:4px 0}
/* 하단 바 */
.bbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--bl);padding:9px 22px;display:flex;gap:9px;align-items:center;z-index:90;box-shadow:0 -2px 10px rgba(0,0,0,.08);flex-wrap:wrap}
.bbar span{font-size:11px;color:var(--su)}
.bb{padding:7px 13px;border-radius:6px;border:none;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.bb-p{background:var(--blue);color:#fff}.bb-p:hover{background:var(--navy)}.bb-p:disabled{background:#9AAAC5;cursor:not-allowed}
.bb-r{background:var(--red);color:#fff}.bb-r:hover{background:#900}.bb-r:disabled{background:#d49;cursor:not-allowed}
.bb-s{background:#fff;color:var(--blue);border:2px solid var(--blue)}.bb-s:hover{background:var(--bl)}
.bb-g{background:#fff;color:var(--g2);border:2px solid var(--g2)}
#prog{font-size:12px;color:var(--blue);font-weight:700}
/* 모달 */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.mbg.open{display:flex}
.mdl{background:#fff;border-radius:12px;padding:22px;width:440px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.mdl h2{font-size:14px;color:var(--navy);margin-bottom:11px}
.mdl p{font-size:12px;color:var(--su);margin-bottom:9px;line-height:1.7}
.fi{margin-bottom:9px}
.fi label{display:block;font-size:11px;font-weight:700;color:var(--navy);margin-bottom:3px}
.fi input,.fi textarea,.fi select{width:100%;padding:7px 10px;border:1.5px solid var(--bd);border-radius:6px;font-family:inherit;font-size:12px}
.fi input:focus{outline:none;border-color:var(--blue)}
.mbs{display:flex;gap:7px;margin-top:12px}
.mb{padding:7px 14px;border-radius:6px;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.mb-p{background:var(--blue);color:#fff}.mb-s{background:#fff;color:var(--blue);border:2px solid var(--blue)}.mb-d{background:#fff;color:var(--red);border:2px solid var(--red)}
/* 토스트 */
.toast{position:fixed;top:60px;right:16px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.ntc{padding:7px 12px;border-radius:6px;font-size:11px;margin-bottom:9px;display:flex;gap:6px}
.ntc.i{background:var(--bl);color:var(--navy)}.ntc.w{background:var(--yl);color:#7A5500}.ntc.e{background:var(--rl);color:var(--red)}
</style>
</head>
<body>
<header>
  <div><h1>학교생활기록부 작성·검토 도우미</h1><p>2026학년도 기재요령 기준 · 고등학교 · 2015 개정 교육과정</p></div>
  <div class="hb">
    <button class="hbtn" id="apiBtn" onclick="openM('apiM')">🔑 API 키</button>
    <button class="hbtn" onclick="openM('impM')">📂 엑셀 불러오기</button>
  </div>
</header>
<div class="toast" id="toast"></div>

<!-- API 모달 -->
<div class="mbg" id="apiM">
  <div class="mdl">
    <h2>🔑 Claude API 키 설정</h2>
    <p>키는 이 브라우저에만 저장됩니다.<br>발급: <a href="https://console.anthropic.com" target="_blank" style="color:var(--blue);font-weight:700">console.anthropic.com</a> → API Keys → Create Key</p>
    <div class="fi"><label>Claude API 키 (sk-ant-...)</label><input type="password" id="ki" placeholder="sk-ant-api03-..."></div>
    <div id="ks" style="font-size:11px;margin-bottom:6px"></div>
    <div class="mbs">
      <button class="mb mb-p" onclick="saveKey()">저장</button>
      <button class="mb mb-d" onclick="clearKey()">삭제</button>
      <button class="mb mb-s" onclick="closeM('apiM')">닫기</button>
    </div>
  </div>
</div>

<!-- 엑셀 불러오기 모달 -->
<div class="mbg" id="impM">
  <div class="mdl">
    <h2>📂 엑셀 양식 불러오기</h2>
    <div class="ntc i">ℹ️ 기존 생활기록부_양식.xlsx 그대로 업로드 가능합니다.</div>
    <div class="fi"><label>엑셀 파일 (.xlsx)</label><input type="file" id="impF" accept=".xlsx,.xls"></div>
    <div class="mbs">
      <button class="mb mb-p" onclick="importXL()">불러오기</button>
      <button class="mb mb-s" onclick="closeM('impM')">닫기</button>
    </div>
  </div>
</div>

<!-- 모드 선택 -->
<div class="mode-select">
  <button class="mode-tab on write" id="mW" onclick="setMode('write')">✍️ 작성 모드</button>
  <button class="mode-tab review" id="mR" onclick="setMode('review')">🔍 검토 모드</button>
</div>

<!-- 영역 탭 -->
<div class="area-tabs">
  <button class="atab on" onclick="setTab(0)">자율활동</button>
  <button class="atab" onclick="setTab(1)">진로활동</button>
  <button class="atab" onclick="setTab(2)">동아리활동</button>
  <button class="atab" onclick="setTab(3)">세특</button>
  <button class="atab" onclick="setTab(4)">행발</button>
</div>

<div class="tbl-wrap"><div id="tbl"></div></div>

<!-- 하단 바 -->
<div class="bbar">
  <span id="modeLabel" style="font-weight:700;color:var(--blue)">✍️ 작성 모드</span>
  <button class="bb bb-p" id="batchW" onclick="batchAll()">⚡ 전체 일괄 생성</button>
  <button class="bb bb-r" id="batchR" onclick="batchAll()" style="display:none">🔍 전체 일괄 검토</button>
  <button class="bb bb-s" onclick="dlTpl()">⬇️ 양식 다운로드</button>
  <button class="bb bb-g" onclick="exportXL()">⬆️ 결과 내보내기</button>
  <span id="prog"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===== 상태 =====
let apiKey=localStorage.getItem('ck')||'';
let mode='write', tabIdx=0;
const TABS=['자율활동','진로활동','동아리활동','세특','행발'];
const MAX={자율활동:500,진로활동:500,동아리활동:500,세특:350,행발:300};

// ===== 데이터 =====
const data={자율활동:[],진로활동:[],동아리활동:[],세특:[],행발:[]};
function mkRow(tab,no){
  const b={no,wResult:'',rResult:null,status:''};
  if(tab==='자율활동') return{...b,학생특성:'',활동1:'',결과물1:'',활동2:'',결과물2:'',활동3:'',결과물3:''};
  if(tab==='진로활동') return{...b,희망분야:'',활동1:'',결과물1:'',활동2:'',결과물2:'',활동3:'',결과물3:''};
  if(tab==='동아리활동') return{...b,참여활동:''};
  if(tab==='세특') return{...b,과목명:'',과제:'',학생평가:'',성취수준:'중'};
  if(tab==='행발') return{...b,담임교사종합의견:''};
}
TABS.forEach(t=>{for(let i=1;i<=5;i++)data[t].push(mkRow(t,i));});

// ===== 프롬프트 =====
const COM_W=`당신은 2026학년도 고등학교 학교생활기록부 작성 전문 보조자입니다.
교사가 직접 관찰·평가한 사실에 근거하여 학생부 문장을 완성합니다.

[절대 금지]
가.공인어학시험(TOEIC·TOEFL·TEPS·HSK·JPT·JLPT·DELF 등) 참여·성적·수상
나.교내·외 대회 참여·성적·수상 / '대회' 단어 자체
다.교외 기관 교외상(표창장·감사장·공로상)
라.교내·외 인증시험 참여·성적
마.모의고사·전국연합학력평가 성적
바.논문 투고·등재·학회 발표
사.도서 출간 / 아.지식재산권 출원·등록
자.해외 어학연수·활동실적
차.부모·친인척 사회·경제적 지위 암시
카.대학명·기관명·기업명·상호명·강사명·학교명·재단명·축제명

[형식]
명사형 종결만 (~함.~음.~임.~을 보임.)
평서형·경어체 금지 (~했다.~합니다.)
특수문자·번호매기기 금지. 줄글만.
주어 지칭 금지('본 학생은' 등). 미래예측 금지.
한글 원칙. 허용 영문: AI·IT·SNS·PPT·CEO 등 일반화 명사, 고유명사, 단위

[내용]
교사 직접 관찰·평가 사실에만 근거. 추측·창작 금지.
학생 작성물 그대로 인용 금지 (교사 관점으로 재서술).
타 영역 내용 혼입 금지.`;

const COM_R=`당신은 2026학년도 학교생활기록부 기재요령 전문 검토관입니다.
길라잡이 현장점검 기준으로 학생부 문장을 정밀 검토합니다.

[공통 절대 금지 가~카]
가.공인어학시험(TOEIC·TOEFL·TEPS·HSK·JPT·JLPT·DELF 등) 참여·성적·수상
나.교내·외 대회 참여·성적·수상 / '대회' 단어 자체 (단순 행사로 명칭 변경도 금지)
다.교외 기관 교외상(표창장·감사장·공로상)
라.교내·외 인증시험 참여·성적
마.모의고사·전국연합학력평가 성적
바.논문 투고·등재·학회 발표 / 사.도서 출간 / 아.지식재산권 출원·등록
자.해외 어학연수·활동실적
차.부모·친인척 사회·경제적 지위 암시
카.대학명·기관명·기업명·상호명·강사명·학교명·재단명·축제명·학교 유추 가능 내용

[공통 형식 규칙]
①명사형 종결어미: ~했다/~한다/~합니다/~되었다 등 평서형·경어체 금지
②특수문자·번호매기기(①②,1.2.,-* 등) 금지
③한글 원칙. 허용 영문: AI·IT·SNS·PPT·CEO 등 일반화 명사, 외국인 성명, 고유명사, 단위. 그 외 영문·한자 금지
④주어 지칭 금지('본 학생은','이 학생은', 학생 이름)
⑤미래예측 금지('향후 발전이 기대됨','잠재력이 무궁함' 등)
⑥개인정보(이름·학번·주민번호·연락처) 금지

[공통 내용 규칙]
①작성 근거: 교사 직접 관찰·평가만. 학생 작성물 그대로 인용 금지 (교사 관점 재서술 필요)
②AI 생성물 그대로 입력 금지
③허위·과장 금지
④타 영역 혼입 금지 (글자수 초과 이유 타 영역 전가 금지)
⑤단순 나열 지양: 개별 특성 드러나지 않는 활동 나열 금지`;

const AREA_W={
자율활동:`[영역]자율활동(2015개정)최대500자
20년경력 담임교사 관점. 400~500자 한 문단.
종결:~드러냄.~발휘함.~보임.~기여함.~변화함.~확인됨.
흐름:배경→역할→구체행동→문제해결→공동체영향→관찰변화
추상평가 금지. 실제 행동으로 역량 표현.
임원:입력된 직책·재임기간만(추정금지). 시작일:2026.03.02.또는2026.03.16.
결과물(학생소감문 등)은 그대로 인용말고 교사관찰 관점으로 재서술.
교과세특·동아리·진로·봉사 내용 혼입 금지.`,

진로활동:`[영역]진로활동(2015개정)최대500자
20년경력 담임교사 관점. 400~500자 한 문단.
종결:~탐색함.~분석함.~구체화함.~발표함.~드러냄.~확인됨.
흐름:초기관심→탐색행동→비교분석→상담활용→진로인식변화

// ===== API =====
async function callClaude(sys,usr){
  const r=await fetch('/.netlify/functions/claude',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({system:sys,user:usr,apiKey:apiKey||''})
  });
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'API 오류 '+r.status);
  return d.text;
}
function pJ(raw){
  // 코드펜스 제거
  let s=raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
  // JSON 블록만 추출
  const st=s.indexOf('{');const en=s.lastIndexOf('}');
  if(st!==-1&&en!==-1) s=s.slice(st,en+1);
  try{
    return JSON.parse(s);
  }catch(e){
    // JSON이 잘린 경우 — 잘린 부분까지만 복구 시도
    // 마지막 완전한 필드까지 살리고 강제 닫기
    let fixed=s;
    // 열린 문자열 닫기
    const qc=(fixed.match(/"/g)||[]).length;
    if(qc%2!==0) fixed+='"';
    // 열린 배열/객체 닫기
    let depth=0;
    for(const c of fixed){if(c==='{')depth++;else if(c==='}')depth--;}
    fixed+=']}'.repeat(0)+'}';
    try{return JSON.parse(fixed);}catch{
      // 복구 실패 시 기본 구조 반환
      const isR=fixed.includes('"위반사항"');
      if(isR) return{mode:'검토',위반사항:[],수정안:'응답이 너무 길어 잘렸습니다. 내용을 줄여 다시 시도해 주세요.',글자수:0,최대글자수:0,초과여부:false,유사도경고:null,종합의견:'응답 파싱 실패 — 재시도 필요'};
      return{mode:'작성',생성문장:'응답이 너무 길어 잘렸습니다. 입력 내용을 줄여 다시 시도해 주세요.',글자수:0,제외한항목:[]};
    }
  }
}

// ===== 입력→텍스트 =====
function r2t(tab,row){
  const L=[];const a=(k,v)=>{if(v&&v.trim())L.push(`<${k}>\n${v.trim()}`);};
  if(tab==='자율활동'){a('학생특성',row.학생특성);[1,2,3].forEach(n=>{a(`활동${n}`,row[`활동${n}`]);a(`결과물${n}`,row[`결과물${n}`]);});}
  else if(tab==='진로활동'){a('희망분야',row.희망분야);[1,2,3].forEach(n=>{a(`활동${n}`,row[`활동${n}`]);a(`결과물${n}`,row[`결과물${n}`]);});}
  else if(tab==='동아리활동'){a('참여활동',row.참여활동);}
  else if(tab==='세특'){a('과목명',row.과목명);a('과제',row.과제);a('학생평가',row.학생평가);a('성취수준',row.성취수준);}
  else if(tab==='행발'){a('담임교사종합의견',row.담임교사종합의견);}
  return L.join('\n\n');
}

async function doRow(tab,i,isReview){
  const row=data[tab][i];
  const txt=r2t(tab,row);
  if(!txt) throw new Error('입력 내용이 없습니다.');
  const MAX_C=MAX[tab];
  const AREA_LABEL={자율활동:'자율활동',진로활동:'진로활동',동아리활동:'동아리활동',세특:'과목별 세부능력 및 특기사항',행발:'행동특성 및 종합의견'};
  if(!isReview){
    const sys=COM_W+'\n\n'+AREA_W[tab];
    const usr=`[작업:작성] 위 규칙을 모두 지켜 아래 입력 자료를 바탕으로 ${AREA_LABEL[tab]} 문장을 완성하세요.\n${W_SCH}\n\n### 입력 자료\n${txt}`;
    const raw=await callClaude(sys,usr);
    return pJ(raw);
  } else {
    const sys=COM_R+'\n\n'+AREA_R[tab];
    const usr=`[작업:검토] 아래 학생부 문장을 위의 모든 기준으로 정밀 점검하세요.\n영역:${AREA_LABEL[tab]} / 최대글자수:${MAX_C}자\n${R_SCH}\n\n검토 대상 문장:\n"""${txt}"""`;
    const raw=await callClaude(sys,usr);
    return pJ(raw);
  }
}

async function genRow(i){
  if(!apiKey){showT('🔑 API 키를 먼저 입력하세요.');openM('apiM');return;}
  const tab=TABS[tabIdx];const row=data[tab][i];
  const isR=mode==='review';
  row.status='loading';row.wResult='';row.rResult=null;
  refreshCell(tab,i);
  const btn=document.getElementById(`gb${i}`);if(btn)btn.disabled=true;
  try{
    const j=await doRow(tab,i,isR);
    if(!isR){row.wResult=j.생성문장||'';}
    else{row.rResult=j;}
    row.status='done';
  }catch(e){row.wResult=e.message;row.rResult={error:e.message};row.status='error';}
  refreshCell(tab,i);
  if(btn)btn.disabled=false;
}

// ===== 일괄 =====
async function batchAll(){
  if(!apiKey){showT('🔑 API 키를 먼저 입력하세요.');openM('apiM');return;}
  const tab=TABS[tabIdx];const rows=data[tab];
  const isR=mode==='review';
  const bW=document.getElementById('batchW');const bR=document.getElementById('batchR');
  if(bW)bW.disabled=true;if(bR)bR.disabled=true;
  const prog=document.getElementById('prog');
  let done=0;
  for(let i=0;i<rows.length;i++){
    const txt=r2t(tab,rows[i]);
    if(!txt){done++;continue;}
    prog.textContent=`처리 중... ${i+1}/${rows.length}`;
    rows[i].status='loading';rows[i].wResult='';rows[i].rResult=null;
    refreshCell(tab,i);
    try{
      const j=await doRow(tab,i,isR);
      if(!isR){rows[i].wResult=j.생성문장||'';}
      else{rows[i].rResult=j;}
      rows[i].status='done';
    }catch(e){rows[i].wResult=e.message;rows[i].rResult={error:e.message};rows[i].status='error';}
    refreshCell(tab,i);done++;
    if(i<rows.length-1)await new Promise(r=>setTimeout(r,1000));
  }
  if(bW)bW.disabled=false;if(bR)bR.disabled=false;
  prog.textContent=`✅ ${done}건 ${isR?'검토':'생성'} 완료`;
  showT(`✅ ${tab} ${done}건 ${isR?'검토':'생성'} 완료`);
}

function renderRC(row,tab){
  const mx=MAX[tab];const isR=mode==='review';
  if(row.status==='loading') return`<div class="ldg">⏳ ${isR?'검토':'생성'} 중...</div>`;
  if(isR){
    if(!row.rResult) return`<span style="color:#bbb;font-size:11px">검토 버튼을 누르세요</span>`;
    if(row.rResult.error) return`<div class="err-cell">❌ ${esc(row.rResult.error)}</div>`;
    const j=row.rResult;const vs=j.위반사항||[];
    let html=`<div class="viol-sum">`;
    if(!vs.length) html+=`<span style="color:var(--g2);font-weight:700">✅ 위반 없음</span>`;
    else{
      vs.forEach(v=>{
        const cl=v.심각도==='높음'?'vh':v.심각도==='중간'?'vm':'vl';
        const ic=v.심각도==='높음'?'🔴':'🟠';
        html+=`<div class="${cl}">${ic} [${esc(v.유형)}] ${esc(v.원문위치||'')} → ${esc(v.수정제안||'')}</div>`;
      });
    }
    html+=`</div>`;
    if(j.수정안) html+=`<div class="fix-box">${esc(j.수정안)}<div class="cnt ${j.글자수>mx?'ov':j.글자수>mx*0.8?'wn':'ok'}">${j.글자수||0}/${mx}자 ${j.글자수>mx?'⚠️초과':''}</div></div>`;
    if(j.유사도경고) html+=`<div class="sim-warn">⚠️ 유사도: ${esc(j.유사도경고)}</div>`;
    if(j.종합의견) html+=`<div style="font-size:10px;color:var(--su);margin-top:4px">💬 ${esc(j.종합의견)}</div>`;
    return html;
  } else {
    if(!row.wResult&&row.status!=='error') return`<span style="color:#bbb;font-size:11px">생성 버튼을 누르세요</span>`;
    if(row.status==='error') return`<div class="err-cell">❌ ${esc(row.wResult)}</div>`;
    const cnt=row.wResult.length;const pct=Math.min(cnt/mx*100,100);
    const bc=cnt>mx?'ov':cnt>mx*0.8?'wn':'ok';
    return`<textarea style="min-height:75px;color:var(--g2);background:var(--gl)" onchange="upd('${TABS[tabIdx]}',${data[TABS[tabIdx]].indexOf(row)},'wResult',this.value)">${esc(row.wResult)}</textarea><div class="cnt ${bc}">${cnt}/${mx}자 ${cnt>mx?'⚠️초과':''}</div>`;
  }
}

function render(){
  const tab=TABS[tabIdx];const rows=data[tab];const isR=mode==='review';
  const rBtnClass=isR?'rb rev':'rb gen';
  const rBtnText=isR?'검토':'생성';
  const rThClass=isR?'rh':'';
  const rThText=isR?`🔍 검토 결과 (최대 ${MAX[tab]}자)`:`✅ 생성 결과 (최대 ${MAX[tab]}자)`;
  const rTdClass=isR?'rres':'wres';
  let h='';

  if(tab==='자율활동'||tab==='진로활동'){
    const fc=tab==='자율활동'?'학생특성':'희망분야';
    h=`<table><thead>
      <tr><th rowspan="2">번호</th><th rowspan="2">${fc}</th>
      <th colspan="2" class="sh">활동 1</th><th colspan="2" class="sh">활동 2</th><th colspan="2" class="sh">활동 3</th>
      <th rowspan="2" class="${rThClass}" style="${isR?'background:#7B1FA2':'background:#1a6b3c'};min-width:220px">${rThText}</th><th rowspan="2">조작</th></tr>
      <tr><th class="sh">활동 내용</th><th class="sh">결과물</th><th class="sh">활동 내용</th><th class="sh">결과물</th><th class="sh">활동 내용</th><th class="sh">결과물</th></tr>
      </thead><tbody>`;
    rows.forEach((row,i)=>{
      const inp=isR?`<textarea style="min-height:80px;color:${isR?'#4A148C':'var(--tx)'}" oninput="upd('${tab}',${i},'${fc}',this.value)" placeholder="${isR?'검토할 '+fc+'...':fc+'...'}">${esc(row[fc])}</textarea>`
        :`<textarea oninput="upd('${tab}',${i},'${fc}',this.value)" placeholder="${fc}...">${esc(row[fc])}</textarea>`;
      h+=`<tr><td class="num">${row.no}</td>
      <td style="min-width:110px">${inp}</td>
      ${[1,2,3].map(n=>`<td style="min-width:130px"><textarea oninput="upd('${tab}',${i},'활동${n}',this.value)" placeholder="활동 내용...">${esc(row[`활동${n}`])}</textarea></td>
      <td style="min-width:110px"><textarea oninput="upd('${tab}',${i},'결과물${n}',this.value)" placeholder="결과물...">${esc(row[`결과물${n}`])}</textarea></td>`).join('')}
      <td class="${rTdClass}" id="rc${i}">${renderRC(row,tab)}</td>
      <td class="act"><button class="${rBtnClass}" onclick="genRow(${i})" id="gb${i}">${rBtnText}</button><button class="rb add" onclick="addR(${i})">+추가</button><button class="rb del" onclick="delR(${i})">−삭제</button></td></tr>`;
    });
    h+=`</tbody></table>`;

  } else if(tab==='동아리활동'){
    h=`<table><thead><tr><th>번호</th><th style="min-width:380px">${isR?'검토할 동아리활동 문장':'참여 활동 내용'}</th>
    <th class="${rThClass}" style="${isR?'background:#7B1FA2':'background:#1a6b3c'};min-width:240px">${rThText}</th><th>조작</th></tr></thead><tbody>`;
    rows.forEach((row,i)=>{
      h+=`<tr><td class="num">${row.no}</td>
      <td><textarea style="min-height:90px" oninput="upd('${tab}',${i},'참여활동',this.value)" placeholder="${isR?'검토할 동아리활동 문장...':'동아리 활동 내용...'}">${esc(row.참여활동)}</textarea></td>
      <td class="${rTdClass}" id="rc${i}">${renderRC(row,tab)}</td>
      <td class="act"><button class="${rBtnClass}" onclick="genRow(${i})" id="gb${i}">${rBtnText}</button><button class="rb add" onclick="addR(${i})">+추가</button><button class="rb del" onclick="delR(${i})">−삭제</button></td></tr>`;
    });
    h+=`</tbody></table>`;

  } else if(tab==='세특'){
    h=`<table><thead><tr><th>번호</th><th style="min-width:85px">과목명</th>
    <th style="min-width:${isR?'0px':'150px'}">${isR?'':' 과제'}</th>
    <th style="min-width:200px">${isR?'검토할 세특 문장':'학생평가'}</th>
    <th style="min-width:70px">${isR?'':'성취수준'}</th>
    <th class="${rThClass}" style="${isR?'background:#7B1FA2':'background:#1a6b3c'};min-width:220px">${rThText}</th><th>조작</th></tr></thead><tbody>`;
    rows.forEach((row,i)=>{
      h+=`<tr><td class="num">${row.no}</td>
      <td><input type="text" value="${esc(row.과목명)}" oninput="upd('${tab}',${i},'과목명',this.value)" placeholder="과목명"></td>
      <td>${isR?'<span style="font-size:10px;color:#bbb">—</span>':`<textarea oninput="upd('${tab}',${i},'과제',this.value)" placeholder="과제·실습...">${esc(row.과제)}</textarea>`}</td>
      <td><textarea style="min-height:80px" oninput="upd('${tab}',${i},'학생평가',this.value)" placeholder="${isR?'검토할 세특 문장...':'교사 관찰 수행 내용...'}">${esc(row.학생평가)}</textarea></td>
      <td>${isR?'<span style="font-size:10px;color:#bbb">—</span>':`<select onchange="upd('${tab}',${i},'성취수준',this.value)">${['상','중상','중','중하','하'].map(v=>`<option${row.성취수준===v?' selected':''}>${v}</option>`).join('')}</select>`}</td>
      <td class="${rTdClass}" id="rc${i}">${renderRC(row,tab)}</td>
      <td class="act"><button class="${rBtnClass}" onclick="genRow(${i})" id="gb${i}">${rBtnText}</button><button class="rb add" onclick="addR(${i})">+추가</button><button class="rb del" onclick="delR(${i})">−삭제</button></td></tr>`;
    });
    h+=`</tbody></table>`;

  } else if(tab==='행발'){
    h=`<table><thead><tr><th>번호</th>
    <th style="min-width:380px">${isR?'검토할 행발 문장':'담임교사 종합 의견'}</th>
    <th class="${rThClass}" style="${isR?'background:#7B1FA2':'background:#1a6b3c'};min-width:220px">${rThText}</th><th>조작</th></tr></thead><tbody>`;
    rows.forEach((row,i)=>{
      h+=`<tr><td class="num">${row.no}</td>
      <td><textarea style="min-height:80px" oninput="upd('${tab}',${i},'담임교사종합의견',this.value)" placeholder="${isR?'검토할 행발 문장...':'담임교사가 관찰한 학생 특성...'}">${esc(row.담임교사종합의견)}</textarea></td>
      <td class="${rTdClass}" id="rc${i}">${renderRC(row,tab)}</td>
      <td class="act"><button class="${rBtnClass}" onclick="genRow(${i})" id="gb${i}">${rBtnText}</button><button class="rb add" onclick="addR(${i})">+추가</button><button class="rb del" onclick="delR(${i})">−삭제</button></td></tr>`;
    });
    h+=`</tbody></table>`;
  }

  document.getElementById('tbl').innerHTML=h;
}

// ===== 엑셀 불러오기 =====
function openM(id){
  if(id==='apiM'){document.getElementById('ki').value=apiKey;const s=document.getElementById('ks');s.textContent=apiKey?'✅ API 키 저장됨':'⚠️ API 키 없음';s.style.color=apiKey?'var(--g2)':'var(--or)';}
  document.getElementById(id).classList.add('open');
}
function closeM(id){document.getElementById(id).classList.remove('open');}

async function importXL(){
  const file=document.getElementById('impF').files[0];
  if(!file){showT('파일을 선택해 주세요.');return;}
  const ab=await file.arrayBuffer();
  const wb=XLSX.read(ab,{type:'array'});
  const SM={'자율활동':'자율활동','진로활동':'진로활동','동아리활동':'동아리활동','세특':'세특','행동발달 및 특기사항':'행발','행발':'행발'};
  let cnt=0;
  wb.SheetNames.forEach(name=>{
    const tab=SM[name];if(!tab)return;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''});
    if(!rows.length)return;
    data[tab]=[];
    rows.forEach((row,i)=>{
      const nr=mkRow(tab,i+1);
      const g=(...ks)=>{for(const k of ks){if(row[k]&&String(row[k]).trim())return String(row[k]).trim();}return'';};
      if(tab==='자율활동'){
        nr.학생특성=g('학생 특성','학생특성');
        [1,2,3].forEach(n=>{nr[`활동${n}`]=g(`활동${n}`,`활동 ${n}`);nr[`결과물${n}`]=g(`결과물${n}`,`결과물 ${n}`);});
      } else if(tab==='진로활동'){
        nr.희망분야=g('희망분야','희망 분야');
        [1,2,3].forEach(n=>{nr[`활동${n}`]=g(`활동${n}`,`활동 ${n}`);nr[`결과물${n}`]=g(`결과물${n}`,`결과물 ${n}`);});
      } else if(tab==='동아리활동'){
        nr.참여활동=g('참여활동','활동내용')||Object.values(row).filter(v=>v&&typeof v==='string'&&v.length>5).join('\n');
      } else if(tab==='세특'){
        nr.과목명=g('과목명');nr.과제=g('과제');nr.학생평가=g('학생평가','학생 평가');nr.성취수준=g('성취수준')||'중';
      } else if(tab==='행발'){
        nr.담임교사종합의견=g('담임교사 종합 의견','담임교사종합의견')||Object.values(row).filter(v=>v&&typeof v==='string'&&v.length>5).slice(-1)[0]||'';
      }
      data[tab].push(nr);cnt++;
    });
  });
  closeM('impM');render();showT(`✅ ${cnt}개 행 불러오기 완료`);
}

// ===== 엑셀 내보내기 =====
function exportXL(){
  const wb=XLSX.utils.book_new();
  const isR=mode==='review';
  TABS.forEach(tab=>{
    const rows=data[tab];if(!rows.length)return;
    const out=rows.map(row=>{
      const base={번호:row.no};
      let res={};
      if(isR&&row.rResult&&!row.rResult.error){
        const j=row.rResult;
        const vs=j.위반사항||[];
        res={위반건수:vs.length,위반상세:vs.map(v=>`[${v.유형}]${v.원문위치}→${v.수정제안}`).join(' / '),수정안:j.수정안||'',종합의견:j.종합의견||''};
      } else if(!isR){res={생성결과:row.wResult||''};}
      if(tab==='자율활동') return{...base,학생특성:row.학생특성,활동1:row.활동1,결과물1:row.결과물1,활동2:row.활동2,결과물2:row.결과물2,활동3:row.활동3,결과물3:row.결과물3,...res};
      if(tab==='진로활동') return{...base,희망분야:row.희망분야,활동1:row.활동1,결과물1:row.결과물1,활동2:row.활동2,결과물2:row.결과물2,활동3:row.활동3,결과물3:row.결과물3,...res};
      if(tab==='동아리활동') return{...base,참여활동:row.참여활동,...res};
      if(tab==='세특') return{...base,과목명:row.과목명,과제:row.과제,학생평가:row.학생평가,성취수준:row.성취수준,...res};
      if(tab==='행발') return{...base,담임교사종합의견:row.담임교사종합의견,...res};
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(out),tab==='행발'?'행동발달및특기사항':tab);
  });
  XLSX.writeFile(wb,`생기부_${isR?'검토':'작성'}_결과_${new Date().toLocaleDateString('ko')}.xlsx`);
  showT('✅ 결과 엑셀 저장됨');
}

// ===== 양식 다운로드 =====
function dlTpl(){
  const wb=XLSX.utils.book_new();
  const a=(n,h,ex)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,...ex]),n);
  a('자율활동',['번호','학생특성','활동1','결과물1','활동2','결과물2','활동3','결과물3'],[[1,'','','','','','','']]);
  a('진로활동',['번호','희망분야','활동1','결과물1','활동2','결과물2','활동3','결과물3'],[[1,'','','','','','','']]);
  a('동아리활동',['번호','참여활동'],[[1,'']]);
  a('세특',['번호','과목명','과제','학생평가','성취수준'],[[1,'','','','중']]);
  a('행동발달 및 특기사항',['번호','담임교사 종합 의견'],[[1,'']]);
  XLSX.writeFile(wb,'생기부_입력양식_2026.xlsx');showT('✅ 양식 다운로드 완료');
}

// ===== API 키 =====
function saveKey(){apiKey=document.getElementById('ki').value.trim();if(apiKey){localStorage.setItem('ck',apiKey);document.getElementById('apiBtn').textContent='🔑 키 등록됨';document.getElementById('apiBtn').classList.add('on');showT('✅ API 키 저장됨');}else clearKey();closeM('apiM');}
function clearKey(){apiKey='';localStorage.removeItem('ck');document.getElementById('apiBtn').textContent='🔑 API 키';document.getElementById('apiBtn').classList.remove('on');closeM('apiM');}

// ===== 유틸 =====
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showT(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
['apiM','impM'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)closeM(id);}));
if(apiKey){document.getElementById('apiBtn').textContent='🔑 키 등록됨';document.getElementById('apiBtn').classList.add('on');}
render();
</script>
