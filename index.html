<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>학교생활기록부 작성·검토 프로그램</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <p class="eyebrow">2015개정 교육과정 3학년 고정</p>
      <h1>학교생활기록부 작성·검토 프로그램</h1>
      <p>자율활동, 동아리활동, 진로활동, 세특, 행발 영역별 입력 양식으로 작성·검토를 보조합니다.</p>
    </header>

    <main class="app-shell">
      <section class="toolbar" aria-label="모드와 영역 선택">
        <div class="mode-toggle" role="group" aria-label="작성 검토 모드">
          <button type="button" class="is-active" data-mode="작성">작성</button>
          <button type="button" data-mode="검토">검토</button>
        </div>
        <nav class="tab-bar" aria-label="영역 탭">
          <button type="button" class="is-active" data-area="자율활동">자율활동</button>
          <button type="button" data-area="동아리활동">동아리활동</button>
          <button type="button" data-area="진로활동">진로활동</button>
          <button type="button" data-area="세특">세특</button>
          <button type="button" data-area="행발">행발</button>
        </nav>
      </section>

      <section class="workspace">
        <form id="record-form" class="panel input-panel">
          <div class="panel-heading">
            <div>
              <h2 id="input-title">자율활동 작성 입력</h2>
              <p id="curriculum-note">교육과정은 2015개정으로 고정되며 자율·자치활동이 아닌 자율활동으로 처리됩니다.</p>
            </div>
            <span id="limit-badge" class="limit-badge">최대 500자</span>
          </div>
          <div id="dynamic-fields" class="field-grid"></div>
          <button type="submit" class="primary-button">결과 생성</button>
        </form>

        <section class="panel result-panel" aria-live="polite">
          <div class="panel-heading">
            <h2>결과</h2>
            <button type="button" id="copy-button" class="secondary-button">복사</button>
          </div>
          <div id="result" class="empty-result">영역별 입력 후 결과 생성을 누르면 작성 또는 검토 결과가 표시됩니다.</div>
        </section>
      </section>
    </main>

    <footer class="excel-footer">
      <a class="secondary-button" href="/api/excel/template">엑셀 양식 다운로드</a>
      <label class="secondary-button upload-button">
        엑셀 업로드·일괄처리
        <input id="excel-upload" type="file" accept=".xlsx" hidden />
      </label>
      <small>FastAPI 백엔드 사용 시 `/api/excel/*` 엔드포인트와 연동됩니다.</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
